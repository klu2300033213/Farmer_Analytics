# MySQL connection
spring.datasource.url=jdbc:mysql://localhost:3306/farmer_analytics?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=prakash
spring.datasource.password=2236

# Default profile for daily safe syncing.
# Use catch-up mode when restarting after downtime:
#   mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=catchup
spring.profiles.default=normal

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Server
server.port=8080

# Allow larger government files (PDF/Word catalogues) during admin imports
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB

# Dedicated admin login (separate from normal user signup)
