# MySQL connection - uses environment variables on production, falls back to local for dev
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/farmer_analytics?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:prakash}
spring.datasource.password=${DB_PASSWORD:2236}

# Default profile
spring.profiles.default=normal

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Server - uses PORT env var (Render sets this automatically)
server.port=${PORT:8081}

# Allow larger government files (PDF/Word catalogues) during admin imports
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB

# Dedicated admin login (separate from normal user signup)
admin.auth.email=${ADMIN_EMAIL:prakash}
admin.auth.password=${ADMIN_PASSWORD:prakash}

# Govt API
gov.api.key=${GOV_API_KEY:579b464db66ec23bdd0000017873384361d04d284777e80bf1d48e10}
gov.api.base-url=https://api.data.gov.in/resource/9ef84268-d588-465a-a308-a864a43d0070
gov.api.fetch-fixed-rate-ms=300000
gov.api.page-limit=1000
gov.api.crop-catalog-max-pages=30

# ML retraining interval (6 hours)
ml.retrain-fixed-rate-ms=21600000
